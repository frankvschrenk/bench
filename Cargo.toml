[package]
name = "bench"
version = "0.9.0"
edition = "2021"
authors = ["Frank von Schrenk"]
description = "bench — NATS request-reply responder desktop app (egui + carbon-egui)"
publish = false

[dependencies]
# Oberfläche: egui/eframe 0.37 mit den Carbon-Widgets. glow statt wgpu hält
# die Abhängigkeiten (und die CI-Pakete unter Linux) klein; persistence merkt
# sich Fenstergröße und -position wie früher tauri-plugin-window-state.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui = "0.37"
# Lokal liegt carbon_egui neben diesem Repo; die CI checkt es an dieselbe Stelle aus.
carbon-egui = { path = "../carbon_egui" }
# BENCH_SHOT: Bildschirmfoto der Oberfläche als PNG (README, Prüfen ohne Bildschirm)
image = { version = "0.25", default-features = false, features = ["png"] }
# Datenordner (com.onisin.bench) und Home-Verzeichnis plattformübergreifend
dirs = "6"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

# bench's backend IS a NATS request-reply responder: its tools touch the local
# filesystem, spawn processes, and reach Postgres. async-nats 0.49 to match
# the headless services; tokio full for spawn/time/process; futures for the
# subscription stream.
async-nats = "0.49"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# ISO-8601 timestamps in fs results (mtime) and the window's time column.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# exec_start session ids (uuid v4); content search (regex + a glob matcher with
# literal_separator so * does not cross / like the Bun glob). git and patch
# shell out via std::process — no extra crates.
uuid = { version = "1", features = ["v4"] }
regex = "1"
globset = "0.4"

# pg.* + task.* tools. sqlx 0.8.6 like oosd/oos (runtime queries, no
# compile-time DB); chrono feature to decode timestamptz -> RFC-3339. No json
# feature on purpose (jsonb is read as ::text, the oosgql/oosd convention).
# reqwest for the task embedding call to Ollama (granite-embedding, 384-dim).
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Dev-IdP (ehemals services/oosiam): OAuth2/PKCE-HTTP-Server, RS256-Signatur,
# argon2id-Passwörter.
axum = "0.8"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
rand = "0.8"
argon2 = "0.5"
data-encoding = "2"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
