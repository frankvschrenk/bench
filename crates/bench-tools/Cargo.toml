[package]
name = "bench-tools"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
description = "MCP tools of the bench (list_operations, set_target, send_message), shared by the bench's own HTTP endpoint and the bench-mcp stdio bridge"
# Like the bench-mcp bridge (no domain logic): Apache-2.0.
license = "Apache-2.0"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { version = "1.7", features = ["server", "macros"] }
