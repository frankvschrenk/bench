[package]
name = "bench-mcp"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
# bench-mcp is a generic MCP bridge with no domain logic: Apache-2.0, separate
# from the BSL-1.1 of oosmem. Until 14.11.2026 it was called bench-nats and
# spoke NATS; now it forwards over HTTP to the bench.
license = "Apache-2.0"

[[bin]]
name = "bench-mcp"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
bench-tools = { path = "../bench-tools" }
# stdio transport for Claude Desktop, which starts us as a child process.
rmcp = { version = "1.7", features = ["server", "transport-io"] }
# Home and data folder on every platform (USERPROFILE/APPDATA on Windows).
dirs = "6"
