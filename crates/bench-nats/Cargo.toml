[package]
name = "bench-nats"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
# bench-nats is a generic MCP bridge with no domain logic, so it keeps the
# permissive Apache-2.0 of the original, separate from the BSL-1.1 of oosmem.
# The name stays from the NATS days (Claude configs and habits use it); since
# 14.11.2026 it speaks HTTP to the bench.
license = "Apache-2.0"

[[bin]]
name = "bench-nats"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
bench-mcp = { path = "../bench-mcp" }
# stdio transport for Claude Desktop, which starts us as a child process.
rmcp = { version = "1.7", features = ["server", "transport-io"] }
# Home and data folder on every platform (USERPROFILE/APPDATA on Windows).
dirs = "6"
